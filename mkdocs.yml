site_name: 浙江高考 Wikipedia
site_description: 中国高考知识百科，涵盖全部学科的知识体系
site_author: 浙江高考 Wikipedia 贡献者
site_url: https://zhzx2026.github.io/gaokao-wiki
repo_name: zhzx2026/gaokao-wiki
repo_url: https://github.com/zhzx2026/gaokao-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zhzx2026/gaokao-wiki

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - footnotes
  - toc:
      permalink: true
      toc_depth: 2
  - attr_list
  - md_in_html

plugins:
  - search:
      lang:
        - zh
        - en

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 数学:
      - 总览: math/index.md
      - 代数基础:
          - 简介: math/algebra/index.md
          - 集合: math/algebra/set.md
          - 常用逻辑用语: math/algebra/logic.md
          - 不等式: math/algebra/inequality.md
          - 复数: math/algebra/complex-number.md
      - 函数与导数:
          - 简介: math/function/index.md
          - 函数概念与性质: math/function/concept.md
          - 幂函数: math/function/power.md
          - 指数函数: math/function/exponential.md
          - 对数函数: math/function/logarithmic.md
          - 函数零点: math/function/zero-point.md
          - 导数:
              - 简介: math/function/derivative/index.md
              - 概念: math/function/derivative/concept.md
              - 单调性: math/function/derivative/monotonicity.md
              - 极值与最值: math/function/derivative/extremum.md
              - 应用: math/function/derivative/application.md
      - 三角函数:
          - 简介: math/trigonometry/index.md
          - 角与弧度制: math/trigonometry/angle-radian.md
          - 定义与性质: math/trigonometry/definition.md
          - 恒等变换: math/trigonometry/identity.md
          - 解三角形: math/trigonometry/triangle.md
      - 平面向量:
          - 简介: math/vector/index.md
          - 概念与线性运算: math/vector/concept.md
          - 基本定理: math/vector/basis.md
          - 数量积: math/vector/dot-product.md
          - 应用: math/vector/application.md
      - 数列:
          - 简介: math/sequence/index.md
          - 等差数列: math/sequence/arithmetic.md
          - 等比数列: math/sequence/geometric.md
          - 递推数列: math/sequence/recurrence.md
          - 数列求和: math/sequence/summation.md
      - 立体几何:
          - 简介: math/solid-geometry/index.md
          - 空间几何体: math/solid-geometry/geometric-body.md
          - 点线面位置关系: math/solid-geometry/position-relation.md
          - 空间向量: math/solid-geometry/space-vector.md
          - 空间角与距离: math/solid-geometry/angle-distance.md
      - 解析几何:
          - 简介: math/analytic-geometry/index.md
          - 直线: math/analytic-geometry/line.md
          - 圆: math/analytic-geometry/circle.md
          - 椭圆: math/analytic-geometry/ellipse.md
          - 双曲线: math/analytic-geometry/hyperbola.md
          - 抛物线: math/analytic-geometry/parabola.md
          - 圆锥曲线:
              - 简介: math/analytic-geometry/conic-section/index.md
              - 统一定义: math/analytic-geometry/conic-section/unified-definition.md
              - 焦点弦性质: math/analytic-geometry/conic-section/focal-property.md
              - 弦长与中点弦: math/analytic-geometry/conic-section/chord-problem.md
      - 概率统计:
          - 简介: math/probability-statistics/index.md
          - 统计抽样: math/probability-statistics/sampling.md
          - 计数原理:
              - 简介: math/probability-statistics/counting/index.md
              - 排列: math/probability-statistics/counting/permutation.md
              - 组合: math/probability-statistics/counting/combination.md
              - 二项式定理: math/probability-statistics/counting/binomial-theorem.md
          - 古典概型: math/probability-statistics/classical-probability.md
          - 条件概率: math/probability-statistics/conditional-probability.md
          - 随机变量:
              - 简介: math/probability-statistics/random-variable/index.md
              - 离散型随机变量: math/probability-statistics/random-variable/discrete.md
              - 二项分布与正态分布: math/probability-statistics/random-variable/binomial-normal.md
          - 成对数据统计分析: math/probability-statistics/regression.md
      - 强基数学:
          - 函数: advanced-math/chapter1/index.md
  - 语文: chinese/index.md
  - 英语: english/index.md
  - 物理: physics/index.md
  - 化学: chemistry/index.md
  - 生物: biology/index.md
  - 政治: politics/index.md
  - 历史: history/index.md
  - 地理: geography/index.md
  - 技术: technology/index.md
  - 其他:
      - 浙江高考规则: zhejiang/index.md
      - 课本清单: zhejiang/textbooks.md
      - 关于: about.md