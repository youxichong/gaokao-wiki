site_name: 浙江高考 Wikipedia
site_description: 中国高考知识百科，涵盖全部学科的知识体系
site_author: 浙江高考 Wikipedia 贡献者
site_url: https://zhzx2026.github.io/gaokao-wiki
repo_name: zhzx2026/gaokao-wiki
repo_url: https://github.com/zhzx2026/gaokao-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zhzx2026/gaokao-wiki

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - footnotes
  - toc:
      permalink: true
      toc_depth: 2
  - attr_list
  - md_in_html

plugins:
  - search:
      lang:
        - zh
        - en

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 数学:
      - 总览: math/index.md
      - 高考数学:
          - 代数基础: math/algebra/index.md
          - 函数与导数: math/function/index.md
          - 三角函数: math/trigonometry/index.md
          - 平面向量: math/vector/index.md
          - 数列: math/sequence/index.md
          - 立体几何: math/solid-geometry/index.md
          - 解析几何: math/analytic-geometry/index.md
          - 概率统计: math/probability-statistics/index.md
      - 拓展阅读:
          - 强基数学: advanced-math/chapter1/index.md
  - 语文: chinese/index.md
  - 英语: english/index.md
  - 物理: physics/index.md
  - 化学: chemistry/index.md
  - 生物: biology/index.md
  - 政治: politics/index.md
  - 历史: history/index.md
  - 地理: geography/index.md
  - 技术: technology/index.md
  - 其他:
      - 浙江高考规则: zhejiang/index.md
      - 课本清单: zhejiang/textbooks.md
      - 关于: about.md